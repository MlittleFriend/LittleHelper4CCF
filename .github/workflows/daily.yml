name: Daily CCF Calculation

on:
  schedule:
    # 盘中早盘 (北京时间 09:40，PBOC 09:15 公布中间价后，UTC 01:40)
    - cron: '40 1 * * 1-5'
    # 盘后结算 (北京时间 17:40，外汇指标全量更新后，UTC 09:40)
    - cron: '40 9 * * 1-5'
  workflow_dispatch: # 允许在 Actions 页面手动触发

concurrency:
  group: ccf-pipeline
  cancel-in-progress: true

permissions:
  contents: write # 允许 workflow 将更新后的 CSV 推送回仓库

jobs:
  calculate_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Main Data Pipeline
        env:
          IFIND_REFRESH_TOKEN: ${{ secrets.IFIND_REFRESH_TOKEN }}
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ccf_data.csv
          # 仅当文件发生变化时才提交
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update CCF data [skip ci]" && git push)

